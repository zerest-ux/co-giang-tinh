<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cố Giang Tình Remix</title>
<style>
:root{--blue:#20a5ff;--cyan:#66e4ff;--bg:#000}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:#eaf5ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow:hidden}
main{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px 18px calc(22px + env(safe-area-inset-bottom));background:#000;isolation:isolate}
main:before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;background:radial-gradient(ellipse at center,#06203c 0%,#000 68%);transition:opacity .2s}
main.beat:before{opacity:.8}
.wrap{width:min(100%,620px);text-align:center}
.tag{font-size:.68rem;letter-spacing:.28em;color:#45617a;margin-bottom:22px;text-transform:uppercase}
h1{font-size:clamp(1.5rem,6vw,2.4rem);line-height:1.15;margin:0 0 24px;font-weight:800;letter-spacing:.08em}
.panel{border:1px solid #14283b;border-radius:22px;background:rgba(3,7,12,.88);padding:25px 18px 20px;box-shadow:0 0 40px #006dff0a}
.visual{height:30px;display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:15px}
.visual span{width:4px;height:8px;border-radius:4px;background:var(--blue);opacity:.85}
.playing .visual span{animation:bars .38s ease-in-out infinite alternate}
.visual span:nth-child(2n){animation-delay:-.2s}.visual span:nth-child(3n){animation-delay:-.1s}
@keyframes bars{to{height:27px}}
.lyric-box{height:clamp(180px,29vh,260px);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px 4px}50%{transform:translateX(3px) skewX(2deg);text-shadow:-3px 0 #00e5ff,3px 0 #315bff}100%{transform:translateX(0);text-shadow:0 0 20px #168bff55}}
body.remix main{animation:beatShake .2s linear}
@keyframes beatShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.progress{height:3px;border-radius:9px;background:#102033;overflow:hidden;margin:5px 0 8px}
#bar{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px var(--blue)}
.time{display:flex;justify-content:space-between;color:#5f7890;font-size:.75rem}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
button{min-height:52px;border-radius:15px;border:1px solid #1c3852;background:#080e16;color:#cce7ff;font:600 1rem system-ui;cursor:pointer}
button.primary{background:linear-gradient(110deg,#0875d4,#1252a6);border-color:#198de9;color:white;box-shadow:0 6px 24px #006dff25}
button:active{transform:scale(.98)}
.note{font-size:.72rem;color:#496078;line-height:1.6;margin:16px 0 0}
@media(max-height:650px){main{padding-top:12px}.tag{margin-bottom:12px}h1{margin-bottom:14px}.panel{padding:16px 14px}.lyric-box{height:150px}.controls{margin-top:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.remix-core{position:relative;width:min(72vw,300px);height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate}
.orbit{position:absolute;left:50%;top:45%;border:1px solid rgba(32,165,255,.22);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.orbit-one{width:180px;height:180px;animation:orbitSpin 12s linear infinite}
.orbit-two{width:135px;height:135px;border-style:dashed;animation:orbitSpin 8s linear infinite reverse}
.core-glow{position:absolute;left:50%;top:45%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#168bff55 0%,#0756b522 48%,transparent 72%);filter:blur(4px);transform:translate(-50%,-50%);transition:transform .12s,opacity .12s}
.equalizer{height:92px;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;z-index:1}
.equalizer i{display:block;width:4px;height:10px;border-radius:5px;background:linear-gradient(180deg,var(--cyan),var(--blue));box-shadow:0 0 10px #168bff66;opacity:.68;transform-origin:center;transition:height .1s}
.playing .equalizer i{animation:centerBars .42s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-.027s)}
.equalizer i:nth-child(5n+1){animation-duration:.31s}.equalizer i:nth-child(3n){animation-duration:.55s}
.core-caption{margin-top:20px;font-size:.64rem;letter-spacing:.38em;color:#55748e;position:relative;z-index:1}
.playing .orbit-one{animation-duration:4.8s}.playing .orbit-two{animation-duration:3.4s}
#stage.beat .core-glow{transform:translate(-50%,-50%) scale(1.45);opacity:1}
#stage.beat .orbit{border-color:rgba(32,165,255,.6)}
@keyframes centerBars{0%{height:8px;opacity:.55}100%{height:calc(14px + (var(--i) % 7)*8px);opacity:1}}
@keyframes orbitSpin{to{rotate:360deg}}
.note:empty{display:none}

</style>
</head>
<body>
<main id="stage">
  <section class="wrap">
    <div class="tag"></div>
    <h1>CỐ GIANG TÌNH REMIX</h1>
    <section class="panel" id="panel">
      <div class="visual" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="lyric-box" aria-hidden="true">
        <div class="remix-core">
          <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
          <div class="core-glow"></div>
          <div class="equalizer"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i><i style="--i:20"></i><i style="--i:21"></i><i style="--i:22"></i><i style="--i:23"></i><i style="--i:24"></i></div>
          <div class="core-caption">REMIX MODE</div>
        </div>
      </div>
      <div class="progress"><span id="bar"></span></div>
      <div class="time"><span id="current">0:00</span><span id="duration">0:00</span></div>
      <div class="controls">
        <button class="primary" id="play">▶ Phát nhạc</button>
        <button id="restart">↻ Phát lại</button>
      </div>
      <p class="note" id="status" aria-live="polite"></p>
    </section>
  </section>
</main>
<audio id="audio" src="music.mp3" preload="metadata" loop></audio>
<script>
(()=>{
 const $=id=>document.getElementById(id), audio=$('audio');
 let beatTimer=null;
 const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")};
 function render(){
   const t=audio.currentTime||0,d=audio.duration||0;
   $('current').textContent=fmt(t);$('duration').textContent=fmt(d);
   $('bar').style.width=(d?Math.min(100,t/d*100):0)+"%";
   // Hiệu ứng nhấn remix nhẹ theo nhịp giả lập; không dùng nhấp nháy mạnh.
   if(!audio.paused && Math.floor(t*2.2)!==Math.floor((t-(1/30))*2.2)){
     document.body.classList.add('remix');$('stage').classList.add('beat');
     clearTimeout(beatTimer);beatTimer=setTimeout(()=>{document.body.classList.remove('remix');$('stage').classList.remove('beat')},110);
   }
 }
 $('play').addEventListener('click',async()=>{
   if(audio.paused){
     try{await audio.play();$('play').textContent='❚❚ Tạm dừng';$('panel').classList.add('playing');$('status').textContent=''}
     catch(e){$('status').textContent='Không phát được — kiểm tra file music.mp3 trên GitHub.'}
   }else audio.pause();
 });
 $('restart').addEventListener('click',()=>{
   audio.currentTime=0;render();
   if(audio.paused)audio.play().catch(()=>{});
 });
 audio.addEventListener('play',()=>{$('play').textContent='❚❚ Tạm dừng';$('panel').classList.add('playing')});
 audio.addEventListener('pause',()=>{$('play').textContent='▶ Phát nhạc';$('panel').classList.remove('playing');document.body.classList.remove('remix');$('stage').classList.remove('beat')});
 audio.addEventListener('timeupdate',render);
 audio.addEventListener('loadedmetadata',render);
 audio.addEventListener('error',()=>{$('status').textContent='Không tìm thấy music.mp3 — đặt file cạnh index.html.'});
 render();
})();
</script>
</body>
</html>
